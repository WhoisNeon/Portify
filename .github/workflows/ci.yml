name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    name: Rust core
    # Portify only ships for Windows, and the Tauri crate needs GTK system
    # libraries to build on Linux. Testing on the shipping platform avoids
    # installing them and matches how the app is actually run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Download sing-box
        if: success()
        shell: pwsh
        run: |
          $version = "1.14.3"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile sing-box.zip
          Expand-Archive -Path sing-box.zip -DestinationPath sing-box-extract -Force
          $sb = (Get-ChildItem -Path sing-box-extract -Recurse -Filter "sing-box.exe" | Select-Object -First 1).FullName
          & $sb version
          "SINGBOX_PATH=$sb" >> $env:GITHUB_ENV
      - name: Validate the generated config with sing-box
        if: success()
        shell: pwsh
        run: |
          & $env:SINGBOX_PATH check -c src-tauri/target/singbox-fixture.json
          if ($LASTEXITCODE -ne 0) { throw "sing-box rejected the generated config" }
      - name: End-to-end test
        if: success()
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --test end_to_end -- --nocapture
      - name: Verify the pinned sing-box digest
        if: success()
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Path sing-box-extract -Recurse -Filter "sing-box.exe" | Select-Object -First 1).FullName
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
          $expected = "5c19bb3f8c12d4e85b3d47fe63123a7624b314b58dd7a8e32f51004f1c4d2faf"
          Write-Host "downloaded: $hash"
          Write-Host "expected:   $expected"
          if ($hash -ne $expected) { throw "sing-box checksum mismatch" }
      # The formatting is applied and pushed back rather than failing the
      # run: the contributor may not have a Rust toolchain locally, and a
      # formatting difference should not hide a real test failure.
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting
        # Only feature branches get the automatic formatting commit; master is
        # left alone so it does not race with a human pushing to it.
        if: github.ref_type == 'branch' && github.ref != 'refs/heads/master'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          if ! git diff --cached --quiet; then
            git commit -m "style: apply rustfmt"
            git push
          fi

  fmt:
    name: Formatting
    # Verifies that the tree is formatted, now that the branch job applies
    # the formatting itself. It checks out the branch tip, which may include
    # the formatting commit the `rust` job pushed.
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  desktop:
    name: Windows desktop build
    # The full Tauri build is slow, so it runs on the branches that matter
    # for shipping rather than on every push.
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
