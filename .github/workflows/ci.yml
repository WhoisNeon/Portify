name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    name: Rust core
    # Portify only ships for Windows, and the Tauri crate needs GTK system
    # libraries to build on Linux. Testing on the shipping platform avoids
    # installing them and matches how the app is actually run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # The formatting is applied and pushed back rather than failing the
      # run: the contributor may not have a Rust toolchain locally, and a
      # formatting difference should not hide a real test failure.
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          if ! git diff --cached --quiet; then
            git commit -m "style: apply rustfmt"
            git push
          fi

  fmt:
    name: Formatting
    # Verifies that the tree is formatted, now that the branch job applies
    # the formatting itself. It checks out the branch tip, which may include
    # the formatting commit the `rust` job pushed.
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  desktop:
    name: Windows desktop build
    # The full Tauri build is slow, so it runs on the branches that matter
    # for shipping rather than on every push.
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
