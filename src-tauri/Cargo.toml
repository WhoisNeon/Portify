[package]
name = "portify"
version = "0.1.0"
description = "Windows Proxy Gateway"
authors = ["WhoisNeon"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name unique from the binary name,
# which matters on Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "portify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
percent-encoding = "2"
reqwest = { version = "0.13", features = [
    "json",
    "socks",
    "rustls",
    "charset",
    "http2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zip = "2.6"
sha2 = "0.10"
dirs = "7"

[features]
# This feature is used for production builds or when a dev server is not
# specified. DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
